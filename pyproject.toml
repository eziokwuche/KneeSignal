[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meniscinet"
version = "0.1.0"
description = "MRI-only models for RSNA Knee Abnormality Detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydicom>=2.4",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
meniscinet = "meniscinet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
